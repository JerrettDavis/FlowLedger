# FlowLedger — Docker Compose
#
# Two usage modes (use profiles to select):
#
#   Infra-only  (Aspire dev loop):
#     docker compose --profile infra up -d
#     Then run: ./eng/scripts/run.ps1  (Aspire orchestrates API + Web + Worker)
#
#   Full stack  (self-hosted / CI validation):
#     docker compose --profile full up --build
#
# Env vars: copy .env.example → .env and set POSTGRES_PASSWORD and API__KEY
# (both REQUIRED for every profile, compose refuses to start without them;
# generate each with `openssl rand -hex 32`).
#
# Secure by default:
#   - apps run as ASPNETCORE_ENVIRONMENT=Production (override in .env for dev);
#   - every host port is bound to 127.0.0.1 only. Put a TLS reverse proxy in
#     front of the Web UI for remote access (see docs/self-hosting/production.md);
#   - the Web UI refuses to start outside Development without OIDC sign-in
#     (Auth__Oidc__*) unless AUTH__ALLOWANONYMOUS=true is set deliberately.
#
# Notes on healthchecks:
#   The .NET 10 chiseled-extra runtime images ship no shell, curl or wget, so
#   CMD-SHELL / curl healthchecks cannot work. The api and web images instead
#   contain /usr/local/bin/healthprobe, a tiny static binary built from
#   scripts/healthprobe (exit 0 only on a 2xx answer). The api is gated on
#   /health, web on /alive; web and worker wait for the api to be healthy.
#   The worker is a Generic Host with no HTTP endpoint; it refreshes a heartbeat file
#   while its Quartz scheduler runs and is probed with `FlowLedger.Worker.dll --healthcheck`.

# ── Shared environment fragments ──────────────────────────────────────────────
x-db-env: &db-env
  ConnectionStrings__flowledger: >-
    Host=postgres;Port=5432;Database=flowledger;Username=flowledger;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}

x-backup-env: &backup-env
  # Backups and pre-migration snapshots must land on the persistent backups_data volume (/data/backups),
  # never on ephemeral container storage. restic ships in the api and worker images.
  Backup__Directory: /data/backups
  # Off-site copy (restic -> B2/S3/sftp/folder). Leave Backup__Restic__Repository empty to disable; see
  # docs/self-hosting/backups-and-recovery.md. restic reads RESTIC_PASSWORD and B2_* from the environment.
  Backup__Restic__Repository: ${Backup__Restic__Repository:-}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
  # Root filesystem is read-only: keep restic's cache on the /tmp tmpfs.
  RESTIC_CACHE_DIR: /tmp/restic-cache
  B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
  B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}

x-redis-env: &redis-env
  # Redis requires a password (REDIS_PASSWORD; falls back to POSTGRES_PASSWORD so existing .env files keep working,
  # but set a separate value). Use hex only: a comma or semicolon would break this connection string.
  ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-${POSTGRES_PASSWORD}}"

# ── Hardening fragments ───────────────────────────────────────────────────────
# Bounded logs: without rotation the json-file driver grows without limit.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Application containers: no privilege escalation, no Linux capabilities, read-only root filesystem
# (writable paths are the named volumes and the /tmp tmpfs), bounded memory/CPU/processes.
# Per-service limits below override the defaults. Size for a single-household deployment; raise
# mem_limit if you import very large files.
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  pids_limit: 512
  logging: *default-logging

x-app-common-env: &app-common-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_HTTP_PORTS: "8080"
  Mx__Enabled: "false"
  # Encrypts the Home Assistant webhook URL at rest (api and worker both read it). Optional; see .env.example.
  HomeAssistant__EncryptionKey: ${HomeAssistant__EncryptionKey:-}
  Secrets__EncryptionKey: ${Secrets__EncryptionKey:-}
  Secrets__EncryptionKeyPrevious: ${Secrets__EncryptionKeyPrevious:-}

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    profiles: [infra, full]
    # Tag + digest (verified by pulling); Dependabot's docker ecosystem keeps both current.
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: flowledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: flowledger
    ports:
      # Loopback only: for the Aspire dev loop / migrate scripts on this machine. Never expose the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Modest tuning sized for the 1 GiB limit below (shared_buffers ~25% of RAM). Raise both together
    # on a bigger host.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "max_connections=100"]
    security_opt:
      - no-new-privileges:true
    # The entrypoint starts as root, fixes data-dir ownership, then drops to the postgres user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: [infra, full]
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    networks: [backend]
    # Password required (REDIS_PASSWORD, falling back to POSTGRES_PASSWORD). redis-cli inside the
    # container authenticates through REDISCLI_AUTH.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-${POSTGRES_PASSWORD}}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-${POSTGRES_PASSWORD}}
    ports:
      # Loopback only (Aspire dev loop). Authenticated, but still never expose it.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    # The entrypoint starts as root, chowns /data, then drops to the redis user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application services (full profile only) ──────────────────────────────

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Api/Dockerfile
    restart: unless-stopped
    <<: *app-hardening
    # backend: postgres/redis; frontend: reachable by web. Web and the outside never see the data stores.
    networks: [backend, frontend]
    mem_limit: 1g
    cpus: 2
    # Let in-flight requests (and a "Back up now" run) finish before SIGKILL.
    stop_grace_period: 30s
    ports:
      # Loopback only: the API key is the only gate in front of every tenant's data.
      - "127.0.0.1:5001:8080"
    environment:
      <<: [*app-common-env, *db-env, *redis-env, *backup-env]
      # Required; the API refuses to start outside Development with a missing or dev-default key.
      Api__Key: ${API__KEY:?Set API__KEY in .env (openssl rand -hex 32)}
      Api__TenantId: "00000000-0000-0000-0000-000000000001"
      # Compose has no separate migration job: apply EF migrations at API startup (idempotent).
      Database__MigrateOnStartup: "true"
      Tenancy__LegacyOwnerEmail: ${TENANCY__LEGACYOWNEREMAIL:-}
    # Raw provider payload archive — MUST be a persistent volume (see ADR 0007).
    volumes:
      - objects_data:/data/objects
      - backups_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Self-contained probe (no shell/curl in the chiseled image): see scripts/healthprobe.
    # /health runs every registered check (Postgres + migrations, Redis, backup freshness), so a
    # database outage marks the api unhealthy. start_period covers EF migrations at startup.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "http://127.0.0.1:8080/health", "4"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 90s

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Web/Dockerfile
    restart: unless-stopped
    <<: *app-hardening
    networks: [frontend]
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 30s
    ports:
      # Loopback only: publish through a TLS reverse proxy for remote access.
      - "127.0.0.1:5002:8080"
    environment:
      <<: *app-common-env
      # Aspire service-discovery env-var convention: services__<name>__<scheme>__<index>
      # This tells the service discovery resolver to map "https+http://api" → http://api:8080
      services__api__http__0: "http://api:8080"
      # API auth — must match the api service's Api__Key so X-Api-Key passes validation.
      # Use the same env-var override pattern as the api service.
      Api__Key: ${API__KEY:?Set API__KEY in .env (openssl rand -hex 32)}
      Api__TenantId: "00000000-0000-0000-0000-000000000001"
      Auth__Oidc__Authority: ${AUTH__OIDC__AUTHORITY:-}
      Auth__Oidc__ClientId: ${AUTH__OIDC__CLIENTID:-}
      Auth__Oidc__ClientSecret: ${AUTH__OIDC__CLIENTSECRET:-}
      # Without OIDC the Web UI has NO sign-in; outside Development it refuses to start unless this is true.
      Auth__AllowAnonymous: ${AUTH__ALLOWANONYMOUS:-false}
      # Persisted Data Protection key ring: sessions/antiforgery survive `up --force-recreate web` (back this volume up).
      DataProtection__KeyPath: /keys
    volumes:
      - web_keys:/keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "http://127.0.0.1:8080/alive", "4"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 45s

  worker:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Worker/Dockerfile
    restart: unless-stopped
    <<: *app-hardening
    networks: [backend]
    mem_limit: 1g
    cpus: 2
    # The worker waits for running jobs (sync, scheduled backup, restic copy) on shutdown; the
    # default 10s grace period would SIGKILL them mid-run.
    stop_grace_period: 120s
    environment:
      <<: [*app-common-env, *db-env, *redis-env, *backup-env]
    volumes:
      - objects_data:/data/objects
      - backups_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Generic Host, no HTTP server: the probe checks the scheduler heartbeat file (refreshed every
    # 15 s in /tmp, a tmpfs; stale after 60 s). No shell/curl in the chiseled image, hence dotnet.
    healthcheck:
      test: ["CMD", "dotnet", "/app/FlowLedger.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Postgres and Redis sit on `backend` only (api + worker); web shares only `frontend` with the api.
networks:
  backend:
  frontend:

volumes:
  postgres_data:
  redis_data:
  objects_data:
  backups_data:
  web_keys:

