# FlowLedger — Docker Compose
#
# Two usage modes (use profiles to select):
#
#   Infra-only  (Aspire dev loop):
#     docker compose --profile infra up -d
#     Then run: ./eng/scripts/run.ps1  (Aspire orchestrates API + Web + Worker)
#
#   Full stack  (self-hosted / CI validation):
#     docker compose --profile full up --build
#
# Env vars: copy .env.example → .env and set POSTGRES_PASSWORD and API__KEY
# (both REQUIRED for every profile, compose refuses to start without them;
# generate each with `openssl rand -hex 32`).
#
# Secure by default:
#   - apps run as ASPNETCORE_ENVIRONMENT=Production (override in .env for dev);
#   - every host port is bound to 127.0.0.1 only. Put a TLS reverse proxy in
#     front of the Web UI for remote access (see docs/self-hosting/production.md);
#   - the Web UI refuses to start outside Development without OIDC sign-in
#     (Auth__Oidc__*) unless AUTH__ALLOWANONYMOUS=true is set deliberately.
#
# Notes on healthchecks:
#   The .NET 10 chiseled-extra runtime images ship no shell, curl or wget, so
#   CMD-SHELL / curl healthchecks cannot work. The api and web images instead
#   contain /usr/local/bin/healthprobe, a tiny static binary built from
#   scripts/healthprobe (exit 0 only on a 2xx answer). The api is gated on
#   /health, web on /alive; web and worker wait for the api to be healthy.
#   The worker is a Generic Host with no HTTP endpoint, so it has no healthcheck
#   (restart: unless-stopped only covers a crashed process).

# ── Shared environment fragments ──────────────────────────────────────────────
x-db-env: &db-env
  ConnectionStrings__flowledger: >-
    Host=postgres;Port=5432;Database=flowledger;Username=flowledger;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}

x-backup-env: &backup-env
  # Backups and pre-migration snapshots must land on the persistent backups_data volume (/data/backups),
  # never on ephemeral container storage. restic ships in the api and worker images.
  Backup__Directory: /data/backups
  # Off-site copy (restic -> B2/S3/sftp/folder). Leave Backup__Restic__Repository empty to disable; see
  # docs/self-hosting/backups-and-recovery.md. restic reads RESTIC_PASSWORD and B2_* from the environment.
  Backup__Restic__Repository: ${Backup__Restic__Repository:-}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
  B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
  B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}

x-redis-env: &redis-env
  ConnectionStrings__redis: "redis:6379"

x-app-common-env: &app-common-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_HTTP_PORTS: "8080"
  Mx__Enabled: "false"
  # Encrypts the Home Assistant webhook URL at rest (api and worker both read it). Optional; see .env.example.
  HomeAssistant__EncryptionKey: ${HomeAssistant__EncryptionKey:-}

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    profiles: [infra, full]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: flowledger
    ports:
      # Loopback only: for the Aspire dev loop / migrate scripts on this machine. Never expose the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: [infra, full]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only (Aspire dev loop). Redis has no auth here: never expose it.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application services (full profile only) ──────────────────────────────

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Api/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only: the API key is the only gate in front of every tenant's data.
      - "127.0.0.1:5001:8080"
    environment:
      <<: [*app-common-env, *db-env, *redis-env, *backup-env]
      # Required; the API refuses to start outside Development with a missing or dev-default key.
      Api__Key: ${API__KEY:?Set API__KEY in .env (openssl rand -hex 32)}
      Api__TenantId: "00000000-0000-0000-0000-000000000001"
      # Compose has no separate migration job: apply EF migrations at API startup (idempotent).
      Database__MigrateOnStartup: "true"
      Tenancy__LegacyOwnerEmail: ${TENANCY__LEGACYOWNEREMAIL:-}
    # Raw provider payload archive — MUST be a persistent volume (see ADR 0007).
    volumes:
      - objects_data:/data/objects
      - backups_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Self-contained probe (no shell/curl in the chiseled image): see scripts/healthprobe.
    # /health runs every registered health check (becomes a real database readiness
    # gate once the API registers one). start_period covers EF migrations at startup.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "http://127.0.0.1:8080/health", "4"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 90s

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Web/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only: publish through a TLS reverse proxy for remote access.
      - "127.0.0.1:5002:8080"
    environment:
      <<: *app-common-env
      # Aspire service-discovery env-var convention: services__<name>__<scheme>__<index>
      # This tells the service discovery resolver to map "https+http://api" → http://api:8080
      services__api__http__0: "http://api:8080"
      # API auth — must match the api service's Api__Key so X-Api-Key passes validation.
      # Use the same env-var override pattern as the api service.
      Api__Key: ${API__KEY:?Set API__KEY in .env (openssl rand -hex 32)}
      Api__TenantId: "00000000-0000-0000-0000-000000000001"
      Auth__Oidc__Authority: ${AUTH__OIDC__AUTHORITY:-}
      Auth__Oidc__ClientId: ${AUTH__OIDC__CLIENTID:-}
      Auth__Oidc__ClientSecret: ${AUTH__OIDC__CLIENTSECRET:-}
      # Without OIDC the Web UI has NO sign-in; outside Development it refuses to start unless this is true.
      Auth__AllowAnonymous: ${AUTH__ALLOWANONYMOUS:-false}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe", "http://127.0.0.1:8080/alive", "4"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 45s

  worker:
    profiles: [full]
    build:
      context: .
      dockerfile: src/FlowLedger.Worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*app-common-env, *db-env, *redis-env, *backup-env]
    volumes:
      - objects_data:/data/objects
      - backups_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Worker is a Generic Host — no HTTP server, so there is nothing for a probe to hit.
    # Liveness is only inferred from the process (restart: unless-stopped); the explicit
    # disable keeps `docker compose ps` from reporting a misleading status.
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  objects_data:
  backups_data:
