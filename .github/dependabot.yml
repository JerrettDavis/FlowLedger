# Keep dependency PRs grouped and delayed for at least 48 hours so newly published packages age before adoption.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 2
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # NuGet lock files (#190): every project commits packages.lock.json and Dependabot's nuget ecosystem updates it in the same PR as the
  # version bump (it runs a lock-aware restore). CI restores with --locked-mode, so a bump PR that lacks the lock change fails visibly.
  # The Web project's Blazor assets pack is pinned in Directory.Build.targets (see CONTRIBUTING.md): bump it with the aspnet image.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 2
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # Microsoft.OpenApi 3.x breaks Microsoft.AspNetCore.OpenApi 10.0.x source generation
      # (CS0200 on IOpenApiMediaType.Example). See Directory.Packages.props comment. Revisit
      # once a stable AspNetCore.OpenApi release supports Microsoft.OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      # FluentAssertions 8.x is under a commercial license; stay on 7.x.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # axe-core 4.12+ adds label-content-name-mismatch, which flags many existing controls; adopt after the a11y cleanup.
      - dependency-name: "Deque.AxeCore.Playwright"
        versions: [">=4.12.0"]
      - dependency-name: "Deque.AxeCore.Commons"
        versions: [">=4.12.0"]

  - package-ecosystem: "docker"
    directories:
      - "/src/FlowLedger.Api"
      - "/src/FlowLedger.Web"
      - "/src/FlowLedger.Worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 2
    groups:
      docker-dependencies:
        patterns:
          - "*"
    ignore:
      # FlowLedger targets net10.0; SDK/runtime majors must be adopted deliberately, not by bot.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
