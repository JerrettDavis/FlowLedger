name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_test_password
      API__KEY: ci-test-api-key-not-for-production
      # The ephemeral CI stack has no identity provider.
      AUTH__ALLOWANONYMOUS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Start full stack
        run: docker compose --profile full up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API /alive..."
          timeout 120 bash -c 'until curl -sf http://localhost:5001/alive > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "API healthy."

      - name: Wait for Web health
        run: |
          echo "Waiting for Web UI..."
          timeout 90 bash -c 'until curl -sf http://localhost:5002/ > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "Web healthy."

      - name: Install Playwright browsers (Chromium only)
        run: |
          # Build puts playwright.ps1 next to the test dll
          pwsh tests/FlowLedger.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests (headless, CI-only)
        run: >
          dotnet test tests/FlowLedger.E2E.Tests
          --no-build
          --configuration Release
          --filter "Category=E2E"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory ./artifacts/tests
        env:
          # Once the E2E base class honours this (tracked in #138), a missing E2E_BASE_URL throws
          # instead of silently skipping.
          E2E_REQUIRED: "true"
          E2E_BASE_URL: http://localhost:5002
          E2E_API_URL: http://localhost:5001
          E2E_API_KEY: ci-test-api-key-not-for-production
          E2E_TENANT_ID: "00000000-0000-0000-0000-000000000001"

      # Guard against a green run with no E2E tests discovered or executed (e.g. a renamed trait/filter).
      # Note: tests that return early via ShouldSkip are still reported as Passed; fixing that needs a
      # change in tests/FlowLedger.E2E.Tests/E2ETestBase.cs (#138).
      - name: Require executed E2E tests
        run: python3 eng/ci/check-trx.py "artifacts/tests/**/e2e-results.trx" --min-executed 1

      - name: Publish E2E test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: E2E Test Results
          path: artifacts/tests/**/*.trx
          reporter: dotnet-trx

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --profile full logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose --profile full down -v
