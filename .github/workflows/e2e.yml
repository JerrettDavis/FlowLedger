# E2E stack (#138): the browser suites run against an OIDC-authenticated stack, like a real multi-user install, not an anonymous one.
#
#   docker-compose.yml + docker-compose.e2e.yml (every compose command passes both -f files) start, besides postgres/redis/migrate/worker:
#   * idp  - navikt/mock-oauth2-server (pinned by digest) that completes the login on its own and issues the verified email
#            e2e-owner@flowledger.test. The api maps that email to the household tenant (Tenancy__LegacyOwnerEmail).
#   * api/web - Production environment with Auth__Oidc__* set, so the real guards apply: Api__TenantSigningKey (api and web), a
#            non-well-known household tenant id (API__TENANTID), the __Host- session cookie, a persisted key ring.
#   The IdP issuer is http://idp:8080/default: containers reach it through a network alias, Chromium through
#   --host-resolver-rules="MAP idp 127.0.0.1" (E2EAuth) and the published port 8080.
#   The test process signs in once (E2EAuth, saved storage state reused by every test) and seeds the household tenant over the API with
#   signed X-Tenant-Sig headers (E2EApi, key E2E_TENANT_SIGNING_KEY). E2E_REQUIRE_AUTH=true makes an unauthenticated stack a failure.
#   TenantIsolationSmokeTests is the two-tenant isolation check through the composed containers.
name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_test_password
      API__KEY: ci-integration-key-not-for-production-0123456789
      # OIDC stack (see the comment block at the top of this file). Throwaway values, not secrets.
      API__TENANTSIGNINGKEY: ci-e2e-tenant-signing-key-0123456789abcdef
      API__TENANTID: e2e00000-0000-4000-8000-000000000001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore --locked-mode

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API /alive..."
          timeout 120 bash -c 'until curl -sf http://localhost:5001/alive > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "API healthy."

      - name: Wait for Web health
        run: |
          echo "Waiting for Web UI..."
          timeout 90 bash -c 'until curl -sf http://localhost:5002/ > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "Web healthy."

      - name: Install Playwright browsers (Chromium only)
        run: |
          # Build puts playwright.ps1 next to the test dll
          pwsh tests/FlowLedger.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests (headless, CI-only)
        run: >
          dotnet test tests/FlowLedger.E2E.Tests
          --no-build
          --configuration Release
          --filter "Category=E2E"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory ./artifacts/tests
        env:
          # A missing E2E_BASE_URL throws instead of skipping (E2ETestBase / E2EFact).
          E2E_REQUIRED: "true"
          E2E_BASE_URL: http://localhost:5002
          E2E_API_URL: http://localhost:5001
          E2E_API_KEY: ci-integration-key-not-for-production-0123456789
          E2E_TENANT_ID: e2e00000-0000-4000-8000-000000000001
          E2E_TENANT_SIGNING_KEY: ci-e2e-tenant-signing-key-0123456789abcdef
          # Fail (never silently run anonymous) unless the stack redirects to the identity provider.
          E2E_REQUIRE_AUTH: "true"

      # Guard against a green run with no E2E tests discovered or executed (e.g. a renamed trait/filter).
      # E2E tests are E2EFact/E2ETheory: skipped when unconfigured, and E2E_REQUIRED=true turns a missing
      # E2E_BASE_URL into a failure, so a pass here means the tests really ran.
      - name: Require executed E2E tests
        run: python3 eng/ci/check-trx.py "artifacts/tests/**/e2e-results.trx" --allow-skip "using the local model|AskInPlainEnglish" --min-executed 20

      - name: Publish E2E test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: E2E Test Results
          path: artifacts/tests/**/*.trx
          reporter: dotnet-trx

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full down -v

  ui-a11y:
    name: UI accessibility (axe, keyboard)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_test_password
      API__KEY: ci-integration-key-not-for-production-0123456789
      # OIDC stack (see the comment block at the top of this file). Throwaway values, not secrets.
      API__TENANTSIGNINGKEY: ci-e2e-tenant-signing-key-0123456789abcdef
      API__TENANTID: e2e00000-0000-4000-8000-000000000001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore --locked-mode

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API /alive..."
          timeout 120 bash -c 'until curl -sf http://localhost:5001/alive > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "API healthy."

      - name: Wait for Web health
        run: |
          echo "Waiting for Web UI..."
          timeout 90 bash -c 'until curl -sf http://localhost:5002/ > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "Web healthy."

      - name: Install Playwright browsers (Chromium only)
        run: |
          # Build puts playwright.ps1 next to the test dll
          pwsh tests/FlowLedger.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Fails the job on any serious or critical axe violation, console error, or horizontal page scroll on a phone.
      - name: Run accessibility sweep (headless, CI-only)
        run: >
          dotnet test tests/FlowLedger.E2E.Tests
          --no-build
          --configuration Release
          --filter "Category=A11y"
          --logger "trx;LogFileName=a11y-results.trx"
          --results-directory ./artifacts/tests
        env:
          # A missing E2E_BASE_URL throws instead of skipping (E2ETestBase / E2EFact).
          E2E_REQUIRED: "true"
          E2E_BASE_URL: http://localhost:5002
          E2E_API_URL: http://localhost:5001
          E2E_API_KEY: ci-integration-key-not-for-production-0123456789
          E2E_TENANT_ID: e2e00000-0000-4000-8000-000000000001
          E2E_TENANT_SIGNING_KEY: ci-e2e-tenant-signing-key-0123456789abcdef
          # Fail (never silently run anonymous) unless the stack redirects to the identity provider.
          E2E_REQUIRE_AUTH: "true"

      # Guard against a green run with no E2E tests discovered or executed (e.g. a renamed trait/filter).
      # E2E tests are E2EFact/E2ETheory: skipped when unconfigured, and E2E_REQUIRED=true turns a missing
      # E2E_BASE_URL into a failure, so a pass here means the tests really ran.
      - name: Require executed accessibility tests
        run: python3 eng/ci/check-trx.py "artifacts/tests/**/a11y-results.trx" --min-executed 20

      - name: Publish E2E test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: UI Accessibility Results
          path: artifacts/tests/**/*.trx
          reporter: dotnet-trx

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-a11y-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full down -v
