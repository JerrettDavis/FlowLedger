name: Security

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC

permissions:
  contents: read
  security-events: write
  actions: read

# NuGet lock files (#190): implicit restores in build/test steps must match the committed packages.lock.json too.
env:
  RestoreLockedMode: true

jobs:
  codeql:
    name: CodeQL Analysis (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: csharp
      - name: Build
        run: dotnet build --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  vuln-scan:
    name: Dependency Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Check for vulnerable packages
        run: |
          output=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable"; then
            echo "::error::Vulnerable NuGet packages detected. Please upgrade or override them."
            exit 1
          fi
          echo "No vulnerable packages found."
