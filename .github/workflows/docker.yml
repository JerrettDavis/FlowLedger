name: Docker

on:
  push:
    branches: [main, master]
    tags:     ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: only the tag-only `push` job below is granted packages: write.
permissions:
  contents: read

jobs:
  build:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    api
            dockerfile: src/FlowLedger.Api/Dockerfile
            image:      flowledger-api
          - service:    web
            dockerfile: src/FlowLedger.Web/Dockerfile
            image:      flowledger-web
          - service:    worker
            dockerfile: src/FlowLedger.Worker/Dockerfile
            image:      flowledger-worker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Docker Buildx for cache-mount support and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ── Lowercase owner (GHCR requires all-lowercase image names) ────────
      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # ── Image tag (release tag on tagged pushes, else "dev") ─────────────
      # This job never pushes; the separate `push` job (tags only) does.
      - name: Compute image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      # ── Build (local only) ───────────────────────────────────────────────
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context:    .
          file:       ${{ matrix.dockerfile }}
          push:       false
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          # Inline cache — speeds up PR builds using previously cached layers
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          # Export the image to Docker daemon so Syft / Trivy can scan it
          load:       true

      # ── Generate SBOM ────────────────────────────────────────────────────
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image:             ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          artifact-name:     sbom-${{ matrix.service }}.spdx.json
          output-file:       /tmp/sbom-${{ matrix.service }}.spdx.json
          format:            spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name:              sbom-${{ matrix.service }}
          path:              /tmp/sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn

      # ── Trivy vulnerability scan ─────────────────────────────────────────
      - name: Trivy vulnerability scan
        # Pinned to a commit SHA (v0.36.0, annotated tag dereferenced); never a mutable branch/tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:         ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          format:            sarif
          output:            trivy-${{ matrix.service }}.sarif
          # Fail on CRITICAL and HIGH vulnerabilities
          severity:          CRITICAL,HIGH
          exit-code:         "0"   # Report but don't fail the build (informational)
          ignore-unfixed:    true

      # Release gate: a tagged build fails on any FIXABLE critical vulnerability.
      - name: Trivy release gate (fixable CRITICAL)
        if: startsWith(github.ref, 'refs/tags/')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:         ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          format:            table
          severity:          CRITICAL
          exit-code:         "1"
          ignore-unfixed:    true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name:              trivy-${{ matrix.service }}
          path:              trivy-${{ matrix.service }}.sarif
          if-no-files-found: warn

      # Gate: fail on fixable CRITICAL vulnerabilities (HIGH stays informational above).
      - name: Trivy gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref:         ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          format:            table
          severity:          CRITICAL
          exit-code:         "1"
          ignore-unfixed:    true

  # ── Release: push to GHCR, sign (cosign keyless), attest SBOM + provenance ─
  # Tag-triggered (v*.*.*) only; the only job with packages: write / id-token: write / attestations: write. The version is the
  # pushed tag, never chosen here; the commit is the tagged commit. Verify a release image with:
  #   cosign verify ghcr.io/<owner>/flowledger-api@<digest> \
  #     --certificate-identity-regexp '^https://github.com/<owner>/FlowLedger/\.github/workflows/docker\.yml@refs/tags/v' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  push:
    name: Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing (Sigstore Fulcio OIDC identity of this workflow)
      attestations: write   # GitHub build-provenance attestation

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    api
            dockerfile: src/FlowLedger.Api/Dockerfile
            image:      flowledger-api
          - service:    web
            dockerfile: src/FlowLedger.Web/Dockerfile
            image:      flowledger-web
          - service:    worker
            dockerfile: src/FlowLedger.Worker/Dockerfile
            image:      flowledger-worker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the gha layer cache warmed by the build job (same scope), then pushes.
      # BuildKit also attaches its own max-detail provenance and SBOM attestations to the image index.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context:    .
          file:       ${{ matrix.dockerfile }}
          push:       true
          provenance: mode=max
          sbom:       true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature's certificate binds this workflow run (repo, ref, workflow) via GitHub OIDC; no key to manage.
      - name: Sign image by digest (cosign keyless)
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM of the pushed image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image:         ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          output-file:   sbom-${{ matrix.service }}.spdx.json
          format:        spdx-json
          upload-artifact: false

      - name: Attach SBOM attestation (cosign)
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.service }}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name:   ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Smoke-test: full-stack compose up ─────────────────────────────────────
  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_test_password
      API__KEY: ci-integration-key-not-for-production-0123456789
      # The ephemeral CI stack has no identity provider.
      AUTH__ALLOWANONYMOUS: "true"
    needs: build
    # Runs on every trigger including PRs, so a broken Dockerfile or compose stack fails the PR.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start full stack
        run: |
          docker compose --profile full up --build -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for API..."
          timeout 120 bash -c 'until curl -sf http://localhost:5001/alive > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "API healthy."
          echo "Waiting for Web..."
          timeout 90 bash -c 'until curl -sf http://localhost:5002/alive > /dev/null; do echo "  still waiting..."; sleep 3; done'
          echo "Web healthy."

      - name: One-shot migrate service succeeded and the API is ready
        run: |
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --profile full ps -a -q migrate)")
          echo "migrate exit code: $code"
          [ "$code" = "0" ] || { echo "::error::migrate service did not exit 0"; docker compose --profile full logs migrate; exit 1; }
          curl -sf http://localhost:5001/ready

      - name: Smoke test — connect + sync
        run: |
          # Connect the Simulated provider
          curl -sf -X POST http://localhost:5001/api/connect \
            -H "X-Api-Key: ci-integration-key-not-for-production-0123456789" \
            -H "X-Tenant-Id: 00000000-0000-0000-0000-000000000001" \
            -H "Content-Type: application/json" | python3 -m json.tool
          # Run a full sync
          curl -sf -X POST http://localhost:5001/api/sync \
            -H "X-Api-Key: ci-integration-key-not-for-production-0123456789" \
            -H "X-Tenant-Id: 00000000-0000-0000-0000-000000000001" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: Smoke test — web dashboard responds
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5002/)
          echo "Web dashboard HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Expected 200, got $HTTP_STATUS"
            exit 1
          fi

      # Executes the documented backup -> restore -> row-count compare procedure (docs/self-hosting/backups-and-recovery.md).
      - name: DR drill - backup, restore into scratch DB, compare row counts
        env:
          OUT_DIR: ${{ runner.temp }}/flowledger-backups
          OBJECTS_DIR: ${{ runner.temp }}/no-objects
        run: |
          out=$(./eng/scripts/backup.sh)
          echo "$out"
          dir=$(echo "$out" | sed -n 's/^Backup OK -> //p')
          restored=$(./eng/scripts/restore.sh "$dir")
          echo "$restored"
          live=$(docker compose exec -T postgres psql -U flowledger -d flowledger -tA -c "SELECT count(*) FROM transactions;" | tr -d '[:space:]')
          back=$(echo "$restored" | awk '$1=="transactions"{print $2}')
          echo "live=$live restored=$back"
          [ "$live" = "$back" ] || { echo "::error::Row count mismatch after restore"; exit 1; }

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --profile full logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose --profile full down -v

  # ── N-1 -> N upgrade: previous commit's stack (its own start-up migration) leaves data in the volumes, then this commit's stack
  # (with the one-shot migrate service) must come up on top of it and keep the data. Pull requests only: the base is the PR target.
  upgrade-from-previous:
    name: Upgrade from previous commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_PASSWORD: ci_test_password
      API__KEY: ci-integration-key-not-for-production-0123456789
      AUTH__ALLOWANONYMOUS: "true"
      COMPOSE_PROJECT_NAME: flowledger-upgrade
      TENANT: 00000000-0000-0000-0000-000000000001
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout base (N-1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Start N-1 and seed data
        working-directory: base
        env:
          # N-1 predates the migrate service: let its API migrate at start-up, as it always did.
          DATABASE__MIGRATEONSTARTUP: "true"
        run: |
          docker compose --profile full up --build -d --wait --wait-timeout 300 postgres redis api
          curl -sf -X POST http://localhost:5001/api/connect -H "X-Api-Key: $API__KEY" -H "X-Tenant-Id: $TENANT" -H "Content-Type: application/json"
          curl -sf -X POST http://localhost:5001/api/sync -H "X-Api-Key: $API__KEY" -H "X-Tenant-Id: $TENANT" -H "Content-Type: application/json" > /dev/null
          docker compose exec -T postgres psql -U flowledger -d flowledger -tA -c "SELECT count(*) FROM transactions;" | tr -d '[:space:]' > "$RUNNER_TEMP/before.txt"
          echo "transactions before upgrade: $(cat "$RUNNER_TEMP/before.txt")"
          docker compose --profile full down

      - name: Start N on the same volumes
        run: |
          docker compose --profile full up --build -d --wait --wait-timeout 300
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --profile full ps -a -q migrate)")
          [ "$code" = "0" ] || { echo "::error::migrate exited $code"; docker compose --profile full logs migrate; exit 1; }
          curl -sf http://localhost:5001/ready

      - name: Data survived the upgrade
        run: |
          after=$(docker compose exec -T postgres psql -U flowledger -d flowledger -tA -c "SELECT count(*) FROM transactions;" | tr -d '[:space:]')
          before=$(cat "$RUNNER_TEMP/before.txt")
          echo "before=$before after=$after"
          [ "$before" = "$after" ] && [ "$before" -gt 0 ] || { echo "::error::transactions changed across the upgrade"; exit 1; }

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --profile full logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose --profile full down -v
