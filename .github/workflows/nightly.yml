name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: Performance tests (wall-clock, excluded from PR gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Run Perf-category tests
        run: >
          dotnet test --no-build --configuration Release
          --filter "Category=Perf"
          --logger "trx;LogFileName=perf-results.trx"
          --results-directory ./artifacts/perf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: artifacts/perf/**/*.trx
          if-no-files-found: ignore

  flake-repeat:
    name: Concurrency tests x10 (flake detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Repeat Worker and Application tests 10 times
        run: |
          for i in $(seq 1 10); do
            echo "::group::run $i"
            dotnet test tests/FlowLedger.Worker.Tests --no-build --configuration Release --filter "Category!=E2E&Category!=Perf" || exit 1
            echo "::endgroup::"
          done
