name: Nightly

# Scheduled verification that does not belong in the PR gate:
#  - repeat the unit/integration suite 3x, and the Infrastructure project (the most timing- and Docker-sensitive) 10x, to surface flakes
#  - run the wall-clock Perf tests excluded from the PR gate (trend via TRX artifacts)
#  - model-check the INV-09 TLA+ spec with TLC (tla2tools.jar pinned by version and sha256)
# Failures open (or comment on) a tracking issue. Mutation testing and live-sandbox runs are not
# wired up yet (they need Stryker tooling and provider credentials respectively).

on:
  schedule:
    - cron: '0 4 * * *'  # Daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# NuGet lock files (#190): implicit restores in build/test steps must match the committed packages.lock.json too.
env:
  RestoreLockedMode: true

jobs:
  repeat-suite:
    name: Suite x3 (flake detection)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLOWLEDGER_REQUIRE_DOCKER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Run suite three times
        run: |
          status=0
          for i in 1 2 3; do
            dotnet test --no-build --configuration Release \
              --filter "Category!=E2E&Category!=A11y&Category!=Screenshots&Category!=Perf&FullyQualifiedName!~ForecastPerformanceTests" \
              --logger "trx" \
              --results-directory "./artifacts/nightly/run-$i" || status=1
          done
          exit $status
      - name: Fail on unexpected skipped tests
        if: always()
        run: python3 eng/ci/check-trx.py "artifacts/nightly/**/*.trx" --allow-skip "LiveSandbox" --min-executed 500
      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-trx-suite
          path: artifacts/nightly/**/*.trx
          if-no-files-found: warn

  repeat-infrastructure:
    name: Infrastructure x10 (flake detection)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLOWLEDGER_REQUIRE_DOCKER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/FlowLedger.Infrastructure.Tests --configuration Release
      - name: Run Infrastructure tests ten times
        run: |
          status=0
          for i in $(seq 1 10); do
            dotnet test tests/FlowLedger.Infrastructure.Tests --no-build --configuration Release \
              --filter "Category!=E2E&Category!=A11y&Category!=Screenshots&Category!=Perf" \
              --logger "trx" \
              --results-directory "./artifacts/nightly-infra/run-$i" || status=1
          done
          exit $status
      - name: Fail on unexpected skipped tests
        if: always()
        run: python3 eng/ci/check-trx.py "artifacts/nightly-infra/**/*.trx" --allow-skip "LiveSandbox" --min-executed 50
      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-trx-infrastructure
          path: artifacts/nightly-infra/**/*.trx
          if-no-files-found: warn

  perf:
    name: Perf tests (trend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/FlowLedger.Application.Tests --configuration Release
      - name: Run Perf tests
        run: >
          dotnet test tests/FlowLedger.Application.Tests --no-build --configuration Release
          --filter "Category=Perf|FullyQualifiedName~ForecastPerformanceTests"
          --logger "trx;LogFileName=perf.trx"
          --results-directory ./artifacts/perf
      - name: Upload Perf TRX
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-trx-perf
          path: artifacts/perf/**/*.trx
          if-no-files-found: warn

  tlc-inv09:
    name: INV-09 TLA+ model check (TLC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned TLA+ release and the sha256 of its tla2tools.jar (verified before it is run).
      TLA_VERSION: v1.7.4
      TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Java is preinstalled on ubuntu-latest runners (TLC needs 11+).
      - name: Download tla2tools.jar (sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tla/tla2tools.jar"             "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  $RUNNER_TEMP/tla/tla2tools.jar" | sha256sum --check -
      - name: Run TLC on SyncLock (fails on any invariant or property violation)
        working-directory: docs/architecture/inv-09-sync-lock
        run: |
          java -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC -config SyncLock.cfg -workers auto -metadir "$RUNNER_TEMP/tlc-states" SyncLock.tla | tee "$RUNNER_TEMP/tlc.log"
          grep -q "Model checking completed. No error has been found." "$RUNNER_TEMP/tlc.log"

  report-failure:
    name: Open issue on failure
    needs: [repeat-suite, repeat-infrastructure, perf, tlc-inv09]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly verification failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The scheduled nightly run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
