name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # dorny/test-reporter publishes a check run
      pull-requests: write # sticky coverage comment
    env:
      # Honoured by the Docker availability checks once they are changed to throw instead of skip
      # (tracked in #151). Until then the TRX skipped-test gate below is the effective guard.
      FLOWLEDGER_REQUIRE_DOCKER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node (JS tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Run JS tests
        run: node --test "tests/js/**/*.test.mjs"

      - name: Restore packages
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (treat warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test --no-build --configuration Release
          --filter "Category!=E2E&Category!=Perf&FullyQualifiedName!~ForecastPerformanceTests"
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./artifacts/tests
          -- xunit.parallelizeAssembly=true

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: xUnit Test Results
          path: artifacts/tests/**/*.trx
          reporter: dotnet-trx

      # Docker-gated suites skip (rather than fail) when no Docker daemon is reachable. Fail the build
      # if anything other than the credentialed live-sandbox tests was skipped, or nothing ran.
      - name: Fail on unexpected skipped tests
        run: python3 eng/ci/check-trx.py "artifacts/tests/**/*.trx" --allow-skip "LiveSandbox" --min-executed 500

      # Renders a line/branch coverage table in the job summary (informational, never fails the build).
      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.4
          reportgenerator \
            "-reports:artifacts/tests/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:MarkdownSummaryGithub" \
            "-assemblyfilters:+FlowLedger.*;-*.Tests"
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Gate: fails the build when Domain/Application line coverage drops below the floors in
      # eng/ci/floors-lines.json (ratchet: raise the floors as coverage improves).
      - name: Coverage floor gate
        run: >
          python3 eng/ci/check-coverage.py eng/ci/floors-lines.json "artifacts/tests/**/coverage.cobertura.xml"
          "$GITHUB_STEP_SUMMARY" --comment-file artifacts/coverage-comment.md

      # Sticky PR comment with the coverage table (delta vs the recorded baseline). Runs even when the gate failed, so the
      # numbers are visible; skipped for fork PRs (their token is read-only) and never fails the build.
      - name: Coverage PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('artifacts/coverage-comment.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate             --jq '.[] | select(.body | startswith("<!-- flowledger-coverage-delta -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@artifacts/coverage-comment.md
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file artifacts/coverage-comment.md
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: artifacts/tests/**/coverage.cobertura.xml
          if-no-files-found: ignore
